services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pixelcraft}
      MYSQL_USER: ${DB_USERNAME:-pixelcraft}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pixelcraft

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
      args: &build-args
        VITE_APP_NAME: ${VITE_APP_NAME:-PixelCraft Studio}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    image: pixelcraft-panel-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_PORT: 3306
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f bootstrap/cache/config.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - pixelcraft

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx
      args: *build-args
    image: pixelcraft-panel-nginx:latest
    container_name: pixelcraft-nginx
    restart: unless-stopped
    # Pas de port public : accessible via le reverse proxy (réseau "web")
    # Décommente si tu veux accéder directement sans reverse proxy :
    # ports:
    #   - "${APP_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - pixelcraft
      - web

  reverb:
    image: pixelcraft-panel-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_PORT: 3306
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - pixelcraft

  worker:
    image: pixelcraft-panel-app:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_PORT: 3306
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - pixelcraft

  # Serveur LiveKit (salons vocaux / visio).
  # Signalisation WS proxifiée en wss:// par le reverse-proxy (réseau "web").
  # Média WebRTC en direct sur l'IP publique : TCP 7881 + UDP 7882 (à ouvrir au pare-feu).
  livekit:
    image: livekit/livekit-server:v1.12.0
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Clés injectées depuis .env (jamais committées). Format "key: secret".
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"        # ICE/TCP (repli quand l'UDP est bloqué)
      - "7882:7882/udp"    # média UDP (mux)
    networks:
      - pixelcraft
      - web

volumes:
  db_data:
  storage_data:

networks:
  pixelcraft:
    driver: bridge
  web:
    external: true
