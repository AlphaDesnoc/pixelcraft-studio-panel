# Config LiveKit pour la PRODUCTION (conteneur Docker sur le VPS).
# Les clés (API key/secret) ne sont PAS ici : elles sont injectées via la
# variable d'env LIVEKIT_KEYS (construite depuis .env dans docker-compose.yml),
# pour ne jamais committer de secret.
#
# La signalisation (WebSocket) est exposée en wss:// par le reverse-proxy nginx
# (sous-domaine dédié -> proxy vers ce conteneur sur le port 7880).
# Le média WebRTC, lui, ne passe PAS par nginx : il va en direct sur l'IP
# publique du serveur via TCP 7881 (repli) et UDP 7882 (mux). Ces ports doivent
# être ouverts au pare-feu du VPS.

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882          # port UDP unique (mux), publié -p 7882:7882/udp
  use_external_ip: true   # détecte l'IP publique (candidats ICE corrects derrière le NAT Docker/Linux)

logging:
  level: info

# TURN intégré désactivé par défaut. À activer (avec un certificat TLS) si des
# clients sur réseaux très restrictifs n'arrivent pas à établir le média.
turn:
  enabled: false
