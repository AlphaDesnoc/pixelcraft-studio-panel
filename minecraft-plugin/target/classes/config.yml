# Configuration de PixelCraftLink

# URL de base de l'API plugin du panel (visible dans l'onglet "Joueurs" du projet),
# ex : https://panel.example.com/api/v1/plugin
# À renseigner une fois ; ensuite il suffit de /pixellink <identifiant>.
panel-url: ""

# Token serveur : rempli AUTOMATIQUEMENT après /pixellink <identifiant>.
# Ne pas modifier à la main.
token: ""

# Intervalle (en secondes) entre deux synchronisations complètes des joueurs en ligne.
sync-interval: 300
