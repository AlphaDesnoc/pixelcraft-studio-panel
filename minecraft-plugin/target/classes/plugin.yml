name: PixelCraftLink
version: 1.0.0
main: studio.pixelcraft.link.PixelCraftLink
api-version: "1.18"
author: PixelCraft Studio
description: Synchronise les joueurs (UUID + IP) vers le panel PixelCraft Studio.

commands:
  pixellink:
    description: Relie ce serveur a un projet du panel PixelCraft Studio.
    usage: /pixellink <identifiant>
    permission: pixelcraftlink.admin

permissions:
  pixelcraftlink.admin:
    description: Autorise la gestion de la liaison au panel.
    default: op
