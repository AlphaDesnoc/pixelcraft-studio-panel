name: Desktop release

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set release version
        working-directory: desktop
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = pkg.version.split('.');
          parts[2] = String(process.env.GITHUB_RUN_NUMBER || '0');
          pkg.version = parts.join('.');
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Release version:', pkg.version);
          EOF

      - name: Build and publish to GitHub Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixelcraft-panel-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: error
